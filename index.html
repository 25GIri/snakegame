<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors & Scoreboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        p.subtitle {
            color: #dcdcdc;
            margin-bottom: 30px;
        }
        .choices {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        button.choice-btn {
            background: white;
            border: none;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button.choice-btn:hover {
            transform: scale(1.1);
            background: #f0f0f0;
        }
        button.choice-btn:active {
            transform: scale(0.95);
        }
        .scoreboard {
            display: flex;
            gap: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
            font-size: 1.2rem;
            font-weight: bold;
        }
        .result-container {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        #resultText {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Enhanced Edition with Score Tracking</p>

    <div class="scoreboard">
        <div>Player: <span id="playerScore">0</span></div>
        <div>Computer: <span id="computerScore">0</span></div>
    </div>

    <div class="choices">
        <button class="choice-btn" onclick="playGame('rock')" title="Rock">✊</button>
        <button class="choice-btn" onclick="playGame('paper')" title="Paper">✋</button>
        <button class="choice-btn" onclick="playGame('scissors')" title="Scissors">✌️</button>
    </div>

    <div class="result-container">
        <div id="choicesDisplay">Choose your weapon!</div>
        <div id="resultText"></div>
    </div>

    <script>
        let pScore = 0;
        let cScore = 0;

        const emojis = {
            rock: '✊',
            paper: '✋',
            scissors: '✌️'
        };

        function playGame(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            document.getElementById('choicesDisplay').innerHTML = 
                `You: ${emojis[playerChoice]} vs Computer: ${emojis[computerChoice]}`;

            let result = '';

            if (playerChoice === computerChoice) {
                result = "It's a Tie! 🤝";
                document.getElementById('resultText').style.color = '#ffeb3b';
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = "You Win! 🎉";
                pScore++;
                document.getElementById('resultText').style.color = '#4caf50';
            } else {
                result = "Computer Wins! 🤖";
                cScore++;
                document.getElementById('resultText').style.color = '#f44336';
            }

            document.getElementById('playerScore').textContent = pScore;
            document.getElementById('computerScore').textContent = cScore;
            document.getElementById('resultText').textContent = result;
        }
    </script>
</body>
</html>
